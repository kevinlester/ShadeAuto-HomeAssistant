# Developer tooling configuration for the ShadeAuto custom integration.
# The integration itself is not a Python package; this file only configures
# ruff, pytest, coverage, bandit and mypy. See CONTRIBUTING.md for the dev loop.

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "ASYNC",  # flake8-async
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "RUF012",  # HA entity classes use mutable class attributes by design
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.shadeauto"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=custom_components.shadeauto --cov-report=term-missing --cov-fail-under=85"
filterwarnings = [
    "error::DeprecationWarning:custom_components.shadeauto",
]

[tool.coverage.run]
source = ["custom_components/shadeauto"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.mypy]
python_version = "3.14"
packages = ["custom_components.shadeauto"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["voluptuous.*", "aiohttp.*"]
ignore_missing_imports = true
