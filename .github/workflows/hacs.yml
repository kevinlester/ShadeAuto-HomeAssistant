name: HACS

# Checks the repository against HACS's requirements for a custom integration
# (hacs.json, manifest, topics, description, README).

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: Validate with HACS action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # The brands check requires a PR to home-assistant/brands, which is
          # outside this repository.
          ignore: brands
